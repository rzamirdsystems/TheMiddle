<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Room</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --primary: #38bdf8;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --weekend: #161e2e; --danger: #ef4444;
            --color-recurring: #0284c7;
            --color-onetime: #f97316;
            --quick-book: #ef4444; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; 
            background: var(--bg-main); color: var(--text-main);
            padding: 40px 20px; overflow-y: auto; 
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-size: 1.8rem; font-weight: 600; margin: 0; color: var(--primary); letter-spacing: -0.03em; }

        /* Modern Navigation Container Layout */
        .nav-container { 
            display: flex; 
            gap: 16px; 
            margin-bottom: 25px; 
            align-items: center; 
        }

        /* Segmented Toggle Control Track */
        .segmented-control {
            display: inline-flex;
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        /* Individual Tab Styling */
        .segment {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .segment:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        /* Active Tab Highlight Style */
        .segment.active {
            background: var(--bg-main);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        .quick-btn { 
            padding: 12px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--quick-book); 
            background: transparent; 
            color: var(--quick-book); 
            font-size: 0.9rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
            text-align: center;
            white-space: nowrap;
        }
        .quick-btn:hover:not(:disabled) { background: var(--quick-book); color: #0f172a; }
        .quick-btn:disabled { border-color: var(--border); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

        #calendar { background: var(--bg-card); padding: 25px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); min-height: 650px; display: block !important; }
        
        .fc { --fc-border-color: var(--border); }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid var(--border); }
        .fc-col-header-cell { padding: 15px 0 !important; background: #1e293b; color: var(--text-main); }
        .fc-day-sat, .fc-day-sun { background-color: var(--weekend) !important; }
        .fc-v-event { border: none !important; border-left: 4px solid #fff !important; cursor: pointer; border-radius: 6px !important; }

        .fc .fc-toolbar { flex-wrap: wrap; gap: 8px; }

        .modal { display: none; position: fixed; z-index: 9999; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-card); padding: 35px; width: 420px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 0 60px rgba(0,0,0,0.7); box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        label { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; display:block; margin-bottom:8px; text-transform: uppercase; }
        input { width: 100%; padding: 15px; background: #0f172a; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; color: white; color-scheme: dark; box-sizing: border-box; }
        
        .time-row { display: flex; gap: 15px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 15px; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger-solid { background: var(--danger); color: white; }

        /* 📱 MOBILE OVERRIDES */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            header { text-align: center; }
            
            .nav-container { 
                flex-direction: column; 
                width: 100%; 
                align-items: stretch; 
                gap: 12px; 
            }
            .segmented-control {
                display: flex; 
            }
            .segment {
                flex: 1; 
            }
            .quick-btn { 
                width: 100%; 
                box-sizing: border-box; 
                padding: 14px;
            }
            
            #calendar { padding: 10px; border-radius: 16px; min-height: 550px; }

            .modal { align-items: flex-end; }
            .modal-content { width: 100%; border-radius: 24px 24px 0 0; max-height: 85vh; padding: 25px 20px; border-bottom: none; }
        }
    </style>
</head>

        </header>

        <div class="nav-container">
            <div class="segmented-control">
